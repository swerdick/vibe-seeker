name: Deploy Backend
on:
  workflow_call:
    inputs:
      image-tag:
        description: "Tag for the container images (plain semver, e.g. 1.4.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image-tag:
        description: "Tag to build and deploy (e.g. 1.4.0). Select the matching vX.Y.Z tag in 'Use workflow from' to rebuild that release."
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ inputs.image-tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build \
            -t $ECR_REGISTRY/${{ vars.ECR_API_REPOSITORY }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ vars.ECR_API_REPOSITORY }}:latest \
            -f backend/Containerfile.lambda backend/
          docker push $ECR_REGISTRY/${{ vars.ECR_API_REPOSITORY }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ vars.ECR_API_REPOSITORY }}:latest

      - name: Update API Lambda
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          aws lambda update-function-code \
            --function-name ${{ vars.LAMBDA_API_FUNCTION_NAME }} \
            --image-uri $ECR_REGISTRY/${{ vars.ECR_API_REPOSITORY }}:$IMAGE_TAG
          aws lambda wait function-updated \
            --function-name ${{ vars.LAMBDA_API_FUNCTION_NAME }}

      - name: Build and push jobs image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build \
            -t $ECR_REGISTRY/${{ vars.ECR_JOBS_REPOSITORY }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/${{ vars.ECR_JOBS_REPOSITORY }}:latest \
            -f backend/Containerfile.jobs backend/
          docker push $ECR_REGISTRY/${{ vars.ECR_JOBS_REPOSITORY }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/${{ vars.ECR_JOBS_REPOSITORY }}:latest

      - name: Update background Lambdas
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          for fn in sync-venues sync-venue-vibes tag-enrichment; do
            aws lambda update-function-code \
              --function-name vibe-seeker-$fn \
              --image-uri $ECR_REGISTRY/${{ vars.ECR_JOBS_REPOSITORY }}:$IMAGE_TAG
            aws lambda wait function-updated \
              --function-name vibe-seeker-$fn
          done
